<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Newgrounds Test</title>
<style>
*{
    font-family: courier;
    color: #FFF;
}
body
{
    background: #111;
}
button, textarea, input
{
    color: #000;
    font-size: 18px;
    resize: none;
}
canvas
{
    background: #999;
}
</style>
</head>
<body>
<b>Newgrounds API Test</b>
<br>
<a href=https://github.com/KilledByAPixel/newgrounds target=_blank>This project is OpenSource on GitHub.</a>
<br><br>
<b>Player</b>
<div id=div_user>Loading...</div>
<br>
<b>Medals</b>
<div id=div_medals></div>
<br>
<button onclick=UnlockMedal(0)>Medal 0</button>
<button onclick=UnlockMedal(1)>Medal 1</button>
<button onclick=UnlockMedal(2)>Medal 2</button>
<br><br>
<b>Scoreboards</b>
<div id=div_scoreboards></div>
<br>
<input id=input_score value=12345 type=number>
<button onclick=PostScore(0)>Post Score</button>
<button onclick=GetScores(0)>Get All Time Scores</button>
<br><br>
<b>Response</b>
<br>
<textarea id=textarea_response readonly cols=60 rows=5></textarea>
<br><br>
<b>Canvas - Shows medal popups when unlocked</b>
<br>
<canvas id=c width=720></canvas>
<script src=newgrounds.js></script>
<script>

'use strict';

// both come from the API Tools page of the project the game is uploaded to
const appID = '59648:CWPyf5NF';
const encryptionCipher = 'ZAXPHNJN52FVWKGv4N/03w=='; // AES-128 Base64
const debug = 1;

// every call is a fetch, so the results come back as promises
let loaded = false;
Newgrounds.Init(appID, encryptionCipher, debug).then(()=>
{
    loaded = true;
    ShowResponse(Newgrounds.medals.length ? 'Ready' : 'Newgrounds unavailable');
});

// who the player is, and if a guest, why
function GetPlayerText()
{
    if (Newgrounds.user)
        return 'Logged in as ' + Newgrounds.user.name;
    const urlSession = new URL(location.href).searchParams.get('ngio_session_id');
    const why = !urlSession ? 'no ngio_session_id in the page URL' :
        'the session in the URL was refused or lost, see the console';
    return 'Guest, ' + why + '. Medals unlock for this page only and scores need a login.';
}

function ShowResponse(response)
{
    textarea_response.value = typeof response == 'string' ?
        response : JSON.stringify(response, null, 1);
}

async function UnlockMedal(index)
{
    ShowResponse('Unlocking...');
    const unlocked = await Newgrounds.UnlockMedal(index);
    ShowResponse(unlocked ? 'Medal unlocked' : 'Medal not unlocked, see the console with debug on');
}

async function PostScore(index)
{
    const response = await Newgrounds.PostScore(index, parseInt(input_score.value));
    ShowResponse(response ?? 'No call made or call failed');
}

async function GetScores(index)
{
    const response = await Newgrounds.GetScores(index, undefined, false, 0, 10, 'A');
    const scores = response?.result?.data?.scores;
    if (!response)
        ShowResponse('No call made or call failed');
    else if (!scores)
        ShowResponse(response);
    else
    {
        const lines = scores.map(score=> score.user.name + ': ' + score.formatted_value);
        ShowResponse(lines.join('\n') || 'No scores yet');
    }
}

function Update()
{
    c.width|=0;
    if (loaded)
        div_user.textContent = GetPlayerText();
    Newgrounds.Update(1/60);
    Newgrounds.Render(c.getContext('2d'));

    let medalText = '';
    for (const medal of Newgrounds.medals)
        medalText += (medal.unlocked ? '&#10004; ' : '') + medal.id + ': ' + Newgrounds.GetMedalDisplayText(medal) + '<br>';
    div_medals.innerHTML = medalText;

    let scoreboardText = '';
    for (const scoreboard of Newgrounds.scoreboards)
        scoreboardText += scoreboard.id + ': ' + scoreboard.name + '<br>';
    div_scoreboards.innerHTML = scoreboardText;
}

setInterval(Update, 16);

</script>
</body>
</html>
